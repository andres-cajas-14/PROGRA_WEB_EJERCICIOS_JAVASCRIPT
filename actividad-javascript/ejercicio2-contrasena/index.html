<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de contraseña</title>
    <link rel="stylesheet" href="../estilos.css">
    <script src="contrasena.js"></script>
</head>

<body>
    <div class="contenedor">
        <div class="tarjeta">
            <h1>Verificador de contraseña</h1>
            <p>Escribe una contraseña.</p>

            <form onsubmit="verificarContrasena(event)">
                <div class="campo">
                    <label for="clave">Contraseña</label>
                    <input type="password" id="clave" oninput="verificarContrasena(event)">
                </div>

                <button type="submit" class="boton">Verificar</button>
            </form>

            <div id="resultado"></div>

            <a class="volver" href="../index.html">Volver al inicio</a>
        </div>
    </div>
</body>

</html>
