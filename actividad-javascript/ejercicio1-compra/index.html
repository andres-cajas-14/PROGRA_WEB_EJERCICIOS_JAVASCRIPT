<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de compra</title>
    <link rel="stylesheet" href="../estilos.css">
    <script src="compra.js"></script>
</head>

<body>
    <div class="contenedor">
        <div class="tarjeta">
            <h1>Calculadora de compra</h1>

            <form onsubmit="calcularTotal(event)" novalidate>
                <div class="campo">
                    <label for="precio">Precio unitario ($)</label>
                    <input type="number" id="precio" step="any">
                </div>

                <div class="campo">
                    <label for="cantidad">Cantidad</label>
                    <input type="number" id="cantidad" step="any">
                </div>

                <button type="submit" class="boton">Calcular total</button>
            </form>

            <div id="resultado"></div>

            <a class="volver" href="../index.html">Volver al inicio</a>
        </div>
    </div>
</body>

</html>
