<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tareas</title>
    <link rel="stylesheet" href="../estilos.css">
    <script src="tareas.js"></script>
</head>

<body>
    <div class="contenedor">
        <div class="tarjeta">
            <h1>Lista de tareas</h1>

            <form onsubmit="agregarTarea(event)">
                <div class="campo">
                    <label for="tarea">Nueva tarea</label>
                    <input type="text" id="tarea">
                </div>

                <button type="submit" class="boton">Agregar tarea</button>
            </form>

            <div id="mensaje"></div>

            <ul id="lista" class="lista-tareas"></ul>

            <a class="volver" href="../index.html">Volver al inicio</a>
        </div>
    </div>
</body>

</html>
